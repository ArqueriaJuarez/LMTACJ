<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMTACJ | Liga Municipal de Tiro con Arco</title>
    
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* === VARIABLES DE COLOR === */
        :root {
            --bg-color: #0f172a;       
            --nav-bg: #020617;         
            --primary: #38bdf8;        
            --primary-hover: #0ea5e9;  
            --text-light: #f8fafc;     
            --text-muted: #94a3b8;     
        }

        /* === RESET BÁSICO === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* === NAVEGACIÓN (HEADER) === */
        header {
            background-color: rgba(2, 6, 23, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        /* Logo en el menú (pequeño) */
        .logo img {
            width: 45px;
            height: auto;
        }

        .logo span {
            color: var(--text-light);
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .logo span b {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* === SECCIÓN HERO (PORTADA) === */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(2, 6, 23, 0.85), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1596409890479-7c9802421319?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            padding: 0 20px;
        }

        .hero-content {
            max-width: 800px;
            animation: fadeIn 1s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo central en la portada (grande) */
        .hero-logo {
            width: 150px;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.3));
        }

        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero-content h1 span {
            color: var(--primary);
        }

        .hero-content p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-primary {
            display: inline-block;
            background-color: var(--primary);
            color: var(--nav-bg);
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.6);
        }

        /* === RESPONSIVO === */
        @media (max-width: 768px) {
            .nav-links {
                display: none; 
            }
            .hero-content h1 {
                font-size: 2.2rem;
            }
            .hero-content p {
                font-size: 1rem;
            }
            .hero-logo {
                width: 120px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN -->
    <header>
        <nav class="navbar">
            <a href="#" class="logo">
                <!-- Logo pequeño en la barra de navegación -->
                <img src="Logo Circulo.png" alt="Logo LMTACJ">
                <span>Arquería <b>Juárez</b></span>
            </a>
            <div class="nav-links">
                <a href="#inicio">Inicio</a>
                <a href="#noticias">Noticias</a>
                <a href="#galeria">Galería</a>
                <a href="#atletas">Atletas</a>
                <a href="#clubes">Clubes</a>
            </div>
        </nav>
    </header>

    <!-- PORTADA (HERO) -->
    <section class="hero" id="inicio">
        <div class="hero-content">
            <!-- Logo principal y centrado -->
            <img src="Logo Circulo.png" alt="Logo Liga Municipal de Tiro con Arco" class="hero-logo">
            
            <h1>Pasión por la <span>Arquería</span> en Ciudad Juárez</h1>
            <p>Apoyamos en la formación de atletas con disciplina, respeto y excelencia deportiva. Únete a la Liga Municipal de Tiro con Arco y eleva tu nivel al máximo.</p>
            <a href="#noticias" class="btn-primary">Últimas Noticias</a>
        </div>
    </section>

</body>
</html>
